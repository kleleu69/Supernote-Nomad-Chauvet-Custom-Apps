plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.supernote.einkbro'
    compileSdk 34

    defaultConfig {
        applicationId "com.supernote.einkbro"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // webkit provides WebViewCompat.addDocumentStartJavaScript for early JS injection
    implementation 'androidx.webkit:webkit:1.9.0'
    // activity-ktx for registerForActivityResult (file chooser)
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
