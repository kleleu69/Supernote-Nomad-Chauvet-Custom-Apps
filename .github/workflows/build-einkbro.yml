name: Build EinkBro iCloud APK

on:
  push:
    branches: [ "feature/supernote-einkbro", "copilot/**" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x einkbro/gradlew
        working-directory: ${{ github.workspace }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ${{ github.workspace }}/einkbro

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: einkbro-icloud-debug
          path: einkbro/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: einkbro-v1.0.${{ github.run_number }}
          name: EinkBro iCloud v1.0.${{ github.run_number }}
          body: |
            E-ink optimised browser for Supernote Nomad with full iCloud Drive support.

            **iCloud patches included:**
            - iOS Safari User-Agent for all *.icloud.com / *.apple.com pages
            - navigator.vendor / platform overrides to pass Apple's browser detection
            - Third-party cookies enabled for persistent iCloud login across apple.com subdomains
            - DOM storage + IndexedDB enabled (required by iCloud Drive SPA)
            - File upload via system file picker (onShowFileChooser)
            - File download handed off to the system handler

            **E-ink optimisations:**
            - No hardware acceleration (avoids partial-refresh artefacts on Supernote screen)
            - No window animations
            - Text zoom 110 % for e-ink readability
            - Minimal toolbar: ← → URL-bar ↻ ☁

            **How to sideload:**
            1. Download `app-debug.apk` below.
            2. Transfer it to your Supernote Nomad via USB or WiFi.
            3. On the tablet, enable *Install unknown apps* and open the APK to install.
            4. Launch **EinkBro iCloud** from the app drawer — it opens iCloud Drive directly.
            5. Sign in with your Apple ID when prompted.
          files: einkbro/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
